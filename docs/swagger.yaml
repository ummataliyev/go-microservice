basePath: /
definitions:
  go-microservice_internal_dto.CreateItemRequest:
    properties:
      description:
        example: 24-hour fermented; baked daily.
        maxLength: 1000
        type: string
      name:
        example: Sourdough loaf
        maxLength: 255
        minLength: 1
        type: string
      quantity:
        example: 12
        minimum: 0
        type: integer
    required:
    - name
    type: object
  go-microservice_internal_dto.CreateUserRequest:
    properties:
      email:
        example: john@example.com
        type: string
      password:
        example: secret123
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  go-microservice_internal_dto.DeleteResponse:
    properties:
      id:
        type: integer
      status:
        type: string
    type: object
  go-microservice_internal_dto.ItemResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      quantity:
        type: integer
      updated_at:
        type: string
    type: object
  go-microservice_internal_dto.LoginRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: secret123
        type: string
    required:
    - email
    - password
    type: object
  go-microservice_internal_dto.MeResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      updated_at:
        type: string
    type: object
  go-microservice_internal_dto.PaginatedResponse-go-microservice_internal_dto_ItemResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/go-microservice_internal_dto.ItemResponse'
        type: array
      meta:
        $ref: '#/definitions/go-microservice_internal_dto.PaginationMeta'
    type: object
  go-microservice_internal_dto.PaginatedResponse-go-microservice_internal_dto_UserResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/go-microservice_internal_dto.UserResponse'
        type: array
      meta:
        $ref: '#/definitions/go-microservice_internal_dto.PaginationMeta'
    type: object
  go-microservice_internal_dto.PaginationMeta:
    properties:
      current_page:
        type: integer
      has_next:
        type: boolean
      has_previous:
        type: boolean
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  go-microservice_internal_dto.RefreshRequest:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
    required:
    - refresh_token
    type: object
  go-microservice_internal_dto.RegisterRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: secret123
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  go-microservice_internal_dto.TokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  go-microservice_internal_dto.UpdateItemRequest:
    properties:
      description:
        example: Updated recipe.
        maxLength: 1000
        type: string
      name:
        example: Sourdough loaf v2
        maxLength: 255
        minLength: 1
        type: string
      quantity:
        example: 20
        minimum: 0
        type: integer
    type: object
  go-microservice_internal_dto.UpdateUserRequest:
    properties:
      email:
        example: new@example.com
        type: string
      password:
        example: newsecret123
        minLength: 6
        type: string
    type: object
  go-microservice_internal_dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      updated_at:
        type: string
    type: object
  go-microservice_internal_errors.ErrorBody:
    properties:
      message:
        type: string
      request_id:
        type: string
      type:
        type: string
    type: object
  go-microservice_internal_errors.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/go-microservice_internal_errors.ErrorBody'
    type: object
host: localhost:8080
info:
  contact: {}
  description: Go microservice template — postgres + JWT auth + middlewares
  title: Go Microservice API
  version: 0.1.0
paths:
  /:
    get:
      description: Returns app name, version, and running status.
      produces:
      - application/json
      responses:
        "200":
          description: app, version, status
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Service info
      tags:
      - Health
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Verifies credentials and returns a fresh access + refresh token pair.
        Email matching is case-insensitive. Repeated failures from the same IP/email
        are throttled (see AUTH_MAX_ATTEMPTS / AUTH_LOCKOUT_SECONDS).
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/go-microservice_internal_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Fresh token pair
          schema:
            $ref: '#/definitions/go-microservice_internal_dto.TokenResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
        "429":
          description: Account locked due to too many failed attempts or rate limit
            exceeded
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
      summary: Log in with email and password
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: 'Returns the authenticated user record. Requires a valid `Authorization:
        Bearer <access_token>` header.'
      produces:
      - application/json
      responses:
        "200":
          description: Authenticated user
          schema:
            $ref: '#/definitions/go-microservice_internal_dto.MeResponse'
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Return the current user
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: |-
        Validates the refresh JWT, revokes it, and issues a fresh access + refresh pair.
        Reuse of a revoked refresh token returns 401.
      parameters:
      - description: Refresh payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/go-microservice_internal_dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Fresh token pair
          schema:
            $ref: '#/definitions/go-microservice_internal_dto.TokenResponse'
        "401":
          description: Invalid or revoked refresh token
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
      summary: Exchange a refresh token for a new pair
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: |-
        Creates a new user account and returns a JWT token pair.
        Email is normalised to lowercase before storage.
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/go-microservice_internal_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Token pair for the newly created user
          schema:
            $ref: '#/definitions/go-microservice_internal_dto.TokenResponse'
        "409":
          description: Email already exists
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
        "429":
          description: Rate limit exceeded
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
      summary: Register a new user
      tags:
      - Auth
  /api/v1/items:
    get:
      description: Returns a paginated list of items.
      parameters:
      - default: 1
        description: Page number (default 1)
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page (default 20)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated item list
          schema:
            $ref: '#/definitions/go-microservice_internal_dto.PaginatedResponse-go-microservice_internal_dto_ItemResponse'
      summary: List items (paginated)
      tags:
      - Items
    post:
      consumes:
      - application/json
      description: Creates a new item.
      parameters:
      - description: Item payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/go-microservice_internal_dto.CreateItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Newly created item
          schema:
            $ref: '#/definitions/go-microservice_internal_dto.ItemResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
      summary: Create an item
      tags:
      - Items
  /api/v1/items/{id}:
    delete:
      description: Hard-deletes the item record.
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "400":
          description: Invalid item_id
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
        "404":
          description: Item not found
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
      summary: Delete an item
      tags:
      - Items
    get:
      description: Returns a single item. 404 if missing.
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Item record
          schema:
            $ref: '#/definitions/go-microservice_internal_dto.ItemResponse'
        "400":
          description: Invalid item_id
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
        "404":
          description: Item not found
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
      summary: Get an item by id
      tags:
      - Items
    patch:
      consumes:
      - application/json
      description: Updates only the fields you send.
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/go-microservice_internal_dto.UpdateItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated item
          schema:
            $ref: '#/definitions/go-microservice_internal_dto.ItemResponse'
        "400":
          description: Invalid item_id
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
        "404":
          description: Item not found
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
      summary: Update an item (partial)
      tags:
      - Items
  /api/v1/users:
    get:
      description: Returns a paginated list of active users.
      parameters:
      - default: 1
        description: Page number (default 1)
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page (default 20)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated user list
          schema:
            $ref: '#/definitions/go-microservice_internal_dto.PaginatedResponse-go-microservice_internal_dto_UserResponse'
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users (paginated)
      tags:
      - Users
    post:
      consumes:
      - application/json
      description: Admin-style user creation. Hashes the password before storage.
      parameters:
      - description: User payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/go-microservice_internal_dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Newly created user
          schema:
            $ref: '#/definitions/go-microservice_internal_dto.UserResponse'
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
        "409":
          description: Email already exists
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a user
      tags:
      - Users
  /api/v1/users/{id}:
    delete:
      description: Soft-deletes the user record.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Delete confirmation
          schema:
            $ref: '#/definitions/go-microservice_internal_dto.DeleteResponse'
        "400":
          description: Invalid user_id
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a user
      tags:
      - Users
    get:
      description: Returns a single user. 404 if missing.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User record
          schema:
            $ref: '#/definitions/go-microservice_internal_dto.UserResponse'
        "400":
          description: Invalid user_id
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a user by id
      tags:
      - Users
    patch:
      consumes:
      - application/json
      description: Updates only the fields you send.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/go-microservice_internal_dto.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated user
          schema:
            $ref: '#/definitions/go-microservice_internal_dto.UserResponse'
        "400":
          description: Invalid user_id
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/go-microservice_internal_errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a user (partial)
      tags:
      - Users
  /health:
    get:
      description: Returns 200 with status:ok when the process is running.
      produces:
      - application/json
      responses:
        "200":
          description: status:ok
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness check
      tags:
      - Health
  /live:
    get:
      description: Returns 200 with status:alive when the process is running.
      produces:
      - application/json
      responses:
        "200":
          description: status:alive
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness probe (Kubernetes-style)
      tags:
      - Health
  /ready:
    get:
      description: Returns 200 when the service is ready to accept traffic.
      produces:
      - application/json
      responses:
        "200":
          description: status:ready
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness probe
      tags:
      - Health
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: '"Type: Bearer {token}"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
